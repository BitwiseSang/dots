# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dots

before:
  hooks:
    - go mod tidy

builds:
  - id: dots
    main: ./cmd/dots
    binary: dots
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/BitwiseSang/dots/internal/version.Version={{.Version}}

archives:
  - id: default
    builds:
      - dots
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - architecture.md

nfpms:
  - id: dots
    package_name: dots
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: BitwiseSang
    homepage: https://github.com/BitwiseSang/dots
    maintainer: BitwiseSang
    description: A modern, selective dotfiles manager with backup, setup, editing, and diff previews.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
